# SwiftLint: must be clean (0 warnings, 0 errors), enforced by the pre-commit hook in .githooks/.
included:
  - Sources
  - Tests
  - Package.swift
excluded:
  - .build

disabled_rules:
  # Trailing commas keep list diffs clean.
  - trailing_comma
  # Internal members that mirror UIWebView/WebKit internals use a leading underscore.
  - identifier_name
  - type_name

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_filter_count
  - sorted_first_last
  - toggle_bool
  - unused_optional_binding
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

nesting:
  type_level: 2
