name: Bug report
description: Something doesn't behave like WKWebView
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code to reproduce
      description: The smallest snippet that shows the problem (no private URLs or credentials).
      render: swift
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What WKWebView does on iOS with the same code.
  - type: input
    id: version
    attributes:
      label: FakeWebKit version
      placeholder: 1.0.1 or commit hash
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: tvOS version and device
      placeholder: tvOS 26.1, Apple TV 4K (3rd generation) / Simulator
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version
      placeholder: "26.1"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of a `WKWebView.logger` implementation, crash logs.
      render: text
